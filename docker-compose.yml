version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: snowflake_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - snowflake_postgres_data:/var/lib/postgresql/data
      - ./исходные данные:/data/исходные данные:ro
      - ./init-postgres:/docker-entrypoint-initdb.d
    networks:
      - highload_labs_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  highload_labs_network:
    driver: bridge

volumes:
  snowflake_postgres_data:

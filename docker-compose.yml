services:
  postgres:
    image: postgres:17
    container_name: bdsnowflake_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bdsnowflake
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./исходные данные:/data:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bdsnowflake']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
